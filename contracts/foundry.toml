[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }, { access = "read", path = "./assets" }]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 64
depth = 50

[rpc_endpoints]
robinhood = "${RPC_URL_4663}"
local = "http://127.0.0.1:8545"
